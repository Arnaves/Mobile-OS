name: Build AXIOM APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
      LLAMA_CPP_PYTHON: 0.3.37   # its sdist vendors a matching llama.cpp source tree
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache native engine
        id: native
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: llama-server-${{ env.LLAMA_CPP_PYTHON }}-${{ env.NDK_VERSION }}-${{ hashFiles('android/build-native.sh') }}

      - name: Build llama-server for arm64 Android
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          pip download "llama-cpp-python==$LLAMA_CPP_PYTHON" --no-binary :all: --no-deps -d /tmp/lcp
          tar xzf /tmp/lcp/llama_cpp_python-*.tar.gz -C /tmp
          export LLAMA_SRC=$(ls -d /tmp/llama_cpp_python-*/vendor/llama.cpp)
          sudo apt-get install -y ninja-build > /dev/null
          android/build-native.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/AXIOM-${GITHUB_SHA::7}.apk"
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AXIOM-apk
          path: out/*.apk
          if-no-files-found: error
