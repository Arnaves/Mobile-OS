<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#04070c">
<title>AXIOM</title>
<style>
:root{
  --bg:#04070c; --panel:#0a111b; --line:#14273a; --text:#cfe8f5; --dim:#5d7a90;
  --c:#3fe0ff; --chat:#3fe0ff; --think:#ffb347; --code:#ff4fd8; --vision:#5dff9c;
  --accent:var(--c); --mono:ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--mono)}
body{display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse at 50% 18%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),
  repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px),var(--bg);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body[data-brain=think]{--accent:var(--think)} body[data-brain=code]{--accent:var(--code)}
body[data-brain=vision]{--accent:var(--vision)}

header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.mark{color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.35em;text-shadow:0 0 12px var(--accent)}
header .sp{flex:1}
.meter{display:flex;align-items:center;gap:6px}
.bar{width:34px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}

#core{position:relative;flex:none;height:min(34vh,230px);display:grid;place-items:center;transition:height .4s}
body.chatting #core{height:110px}
.reactor{position:relative;width:min(30vh,190px);aspect-ratio:1;transition:width .4s}
body.chatting .reactor{width:88px}
.reactor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:var(--accent);transform-origin:50% 50%}
.r1{stroke-width:1;opacity:.35}
.r2{stroke-width:2.5;stroke-dasharray:40 18 8 18;animation:spin 14s linear infinite}
.r3{stroke-width:1.5;stroke-dasharray:2 6;opacity:.7;animation:spin 30s linear infinite reverse}
.r4{stroke-width:4;stroke-dasharray:70 200;stroke-linecap:round;opacity:.9;animation:spin 3.2s cubic-bezier(.6,0,.4,1) infinite}
.orb{position:absolute;inset:32%;border-radius:50%;
  background:radial-gradient(circle,#fff 0,var(--accent) 30%,color-mix(in srgb,var(--accent) 30%,transparent) 62%,transparent 72%);
  filter:blur(.5px);animation:breathe 4s ease-in-out infinite}
body[data-state=busy] .r2{animation-duration:2.2s} body[data-state=busy] .r4{animation-duration:.9s}
body[data-state=busy] .orb{animation-duration:.8s}
body[data-state=loading] .r4{animation-duration:1.4s;stroke-dasharray:20 30}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.82);opacity:.75}}
.status{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
body.chatting .status{display:none}

nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;flex:none}
nav button{flex:none;font:inherit;font-size:11px;letter-spacing:.14em;padding:6px 12px;border-radius:2px;
  background:transparent;color:var(--dim);border:1px solid var(--line);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
nav button.on{color:var(--bg);background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--accent)}
nav button[data-b=think]{--accent:var(--think)} nav button[data-b=code]{--accent:var(--code)}
nav button[data-b=vision]{--accent:var(--vision)} nav button[data-b=chat],nav button[data-b=auto]{--accent:var(--chat)}
.ai[data-b=chat]{--accent:var(--chat)} .ai[data-b=think]{--accent:var(--think)} .ai[data-b=code]{--accent:var(--code)} .ai[data-b=vision]{--accent:var(--vision)}

#log{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.hint{margin:auto 0;color:var(--dim);font-size:12px;text-align:center;line-height:2}
.hint b{color:var(--text);font-weight:400;cursor:pointer;border-bottom:1px dashed var(--line)}
.msg{max-width:100%;overflow-wrap:anywhere;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.me{align-self:flex-end;max-width:85%;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:10px 10px 2px 10px}
.me img{display:block;max-width:160px;border-radius:6px;margin-bottom:6px}
.ai{border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.tag{font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.ai p{margin:0 0 .6em} .ai p:last-child{margin:0}
.ai code{background:var(--panel);padding:1px 5px;border-radius:3px;color:var(--accent)}
.ai pre{position:relative;background:#02050a;border:1px solid var(--line);border-radius:6px;padding:10px;margin:.5em 0;overflow-x:auto;font-size:12.5px}
.ai pre code{background:none;padding:0;color:var(--text)}
.ai pre button{position:absolute;top:4px;right:4px;font:inherit;font-size:10px;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
details{font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:4px;padding:4px 8px;margin-bottom:6px}
details summary{cursor:pointer;letter-spacing:.15em;font-size:10px;text-transform:uppercase}
details div{white-space:pre-wrap;margin-top:4px}
.err{color:#ff6b6b}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

form{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 12px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent)}
.preview{position:relative} .preview img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--vision)}
textarea{flex:1;min-width:0;resize:none;max-height:120px;font:inherit;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ib{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);cursor:pointer}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.go{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.ib.live{color:var(--accent);border-color:var(--accent);animation:breathe 1s infinite}
.ib.on{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body data-brain="chat" data-state="idle">
<header>
  <span class="mark">AXIOM</span><span id="clock">--:--</span><span class="sp"></span>
  <span class="meter" title="RAM in use">RAM<span class="bar"><i id="ram"></i></span></span>
  <span id="bat">--%</span><span id="temp"></span>
</header>

<section id="core">
  <div class="reactor">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring r1" cx="50" cy="50" r="48"/>
      <circle class="ring r2" cx="50" cy="50" r="42"/>
      <circle class="ring r3" cx="50" cy="50" r="36"/>
      <circle class="ring r4" cx="50" cy="50" r="30"/>
    </svg>
    <div class="orb"></div>
  </div>
  <div class="status" id="status">offline · standby</div>
</section>

<nav id="brains">
  <button data-b="auto" class="on">AUTO</button><button data-b="chat">CHAT</button>
  <button data-b="think">THINK</button><button data-b="code">CODE</button><button data-b="vision">VISION</button>
</nav>

<main id="log">
  <div class="hint">All intelligence on-device · zero cloud<br>
    try <b>plan a 3-day trip to Goa</b> · <b>write a python todo app</b><br>
    <b>remember that I prefer short answers</b></div>
</main>

<form id="f">
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <button type="button" class="ib" id="camBtn" title="Camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <span class="preview" id="pv" hidden><img id="pvImg" alt=""></span>
  <textarea id="q" rows="1" placeholder="Command AXIOM…" enterkeyhint="send"></textarea>
  <button type="button" class="ib" id="mic" title="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button type="button" class="ib" id="tts" title="Speak replies"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  <button class="ib go" title="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
</form>

<script>
const $ = s => document.querySelector(s);
const log = $("#log"), q = $("#q"), body = document.body;
let brain = "auto", image = null, speak = false, busy = false;
try { speak = localStorage.getItem("axiom.tts") === "1"; } catch (e) {}
$("#tts").classList.toggle("on", speak);

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(src) {
  const parts = src.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/);
  let html = "";
  for (let i = 0; i < parts.length; i += 3) {
    html += esc(parts[i]).split(/\n{2,}/).filter(Boolean).map(p =>
      "<p>" + p.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>") + "</p>").join("");
    if (i + 2 < parts.length) html += `<pre><button type="button">COPY</button><code>${esc(parts[i + 2])}</code></pre>`;
  }
  return html;
}
function render(el, text) {
  const m = text.match(/^\s*<think>([\s\S]*?)(<\/think>|$)([\s\S]*)/);
  let h = "";
  if (m) h = `<details${m[2] ? "" : " open"}><summary>reasoning trace</summary><div>${esc(m[1].trim())}</div></details>` + md(m[3]);
  else h = md(text);
  el.innerHTML = h;
}
log.addEventListener("click", e => {
  if (e.target.matches("pre button")) {
    navigator.clipboard?.writeText(e.target.nextElementSibling.textContent);
    e.target.textContent = "COPIED"; setTimeout(() => e.target.textContent = "COPY", 1200);
  }
  if (e.target.matches(".hint b")) { q.value = e.target.textContent; $("#f").requestSubmit(); }
});

function setBrainUI(b) { body.dataset.brain = b === "auto" ? "chat" : b; }
$("#brains").addEventListener("click", e => {
  const b = e.target.dataset.b; if (!b) return;
  brain = b; document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === e.target));
  setBrainUI(b);
});
function setState(s, label) { body.dataset.state = s; $("#status").textContent = label; }

$("#camBtn").onclick = () => $("#cam").click();
$("#cam").onchange = () => {
  const file = $("#cam").files[0]; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {   // downscale: faster vision encoding on-device
    const k = Math.min(1, 896 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    image = c.toDataURL("image/jpeg", .85); $("#pvImg").src = image; $("#pv").hidden = false; URL.revokeObjectURL(url);
  };
  img.src = url; $("#cam").value = "";
};
$("#pv").onclick = () => { image = null; $("#pv").hidden = true; };

$("#tts").onclick = () => {
  speak = !speak; $("#tts").classList.toggle("on", speak);
  try { localStorage.setItem("axiom.tts", speak ? "1" : "0"); } catch (e) {}
  if (!speak) speechSynthesis?.cancel();
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("#mic").onclick = () => {
  if (!SR) { q.placeholder = "Voice not supported here — use `axiom voice`"; return; }
  const r = new SR(); r.lang = navigator.language || "en-US"; r.interimResults = true;
  $("#mic").classList.add("live");
  r.onresult = e => { q.value = [...e.results].map(x => x[0].transcript).join(""); };
  r.onend = () => { $("#mic").classList.remove("live"); if (q.value.trim()) $("#f").requestSubmit(); };
  r.start();
};

q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#f").requestSubmit(); } });

$("#f").onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if ((!text && !image) || busy) return;
  busy = true; body.classList.add("chatting"); log.querySelector(".hint")?.remove();
  const me = document.createElement("div"); me.className = "msg me";
  me.innerHTML = (image ? `<img src="${image}" alt="">` : "") + esc(text || "Describe this.");
  const ai = document.createElement("div"); ai.className = "msg ai";
  ai.innerHTML = `<div class="tag">…</div><div class="out cursor"></div>`;
  log.append(me, ai); log.scrollTop = log.scrollHeight;
  const tag = ai.querySelector(".tag"), out = ai.querySelector(".out");
  const payload = { message: text, brain, image }; q.value = ""; q.style.height = "auto";
  image = null; $("#pv").hidden = true;
  let full = "";
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line) continue;
        const m = JSON.parse(line);
        if (m.brain) { ai.dataset.b = m.brain; tag.textContent = m.brain + " brain"; setBrainUI(m.brain);
          setState(m.loading ? "loading" : "busy", m.loading ? `loading ${m.brain} core` : `${m.brain} · processing`); }
        if (m.d) { if (body.dataset.state !== "busy") setState("busy", "processing"); full += m.d; render(out, full); log.scrollTop = log.scrollHeight; }
        if (m.error) out.insertAdjacentHTML("beforeend", `<p class="err">⚠ ${esc(m.error)}</p>`);
      }
    }
  } catch (err) {
    out.innerHTML = `<p class="err">⚠ Link to AXIOM core lost. Is <code>axiom hud</code> running in Termux?</p>`;
  }
  out.classList.remove("cursor"); busy = false; setState("idle", "standby");
  if (brain === "auto") setBrainUI("auto");
  if (speak && full && window.speechSynthesis) {
    const say = full.replace(/<think>[\s\S]*?<\/think>/, "").replace(/```[\s\S]*?```/g, " code block. ").replace(/[*`#]/g, "");
    speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(say.slice(0, 1500)));
  }
};

async function vitals() {
  try {
    const v = await (await fetch("/api/status")).json();
    if (v.ram != null) $("#ram").style.width = v.ram + "%";
    if (v.battery != null) $("#bat").textContent = v.battery + "%";
    if (v.temp != null) $("#temp").textContent = Math.round(v.temp) + "°C";
    if (!busy) setState("idle", v.up ? `${v.brain} core · online` : "offline · standby");
  } catch (e) { if (!busy) setState("idle", "core link down"); }
}
const tick = () => { $("#clock").textContent = new Date().toTimeString().slice(0, 5); }; tick(); setInterval(tick, 1000);
setInterval(vitals, 10000); vitals();
</script>
</body>
</html>
